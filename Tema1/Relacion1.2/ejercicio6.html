<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>
    <script>
        for (var tabla = 1; tabla <= 10; tabla++) {
            
            document.write("<h3>Tabla del " + tabla + ":</h3>");

            for (var i = 1; i <= 10; i++) {
                var resultado = i * tabla;
                document.write(i + " x " + tabla + " = " + resultado + "<br>");
            }

            document.write("<br>");
        }
    </script>
</body>
</html>
