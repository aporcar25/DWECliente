<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <script>
        // Le pedimos la edad al usuario
        var edad = prompt("Introduce tu edad: ");

        // Comprobamos todas las edades 
        if (edad > 18) {
            alert("absoluto");
        } else if (edad >= 16) {
            alert("juvenil");
        } else if (edad >= 14) {
            alert("cadete");
        } else if (edad >= 12) {
            alert ("infantil");
        } else if (edad >= 10) {
            alert("alevín");
        } else if (edad >= 8) {
            alert("benjamín");
        } else {
            alert("La edad introducida es menor de 8 años.")
        }
    </script>
</body>
</html>
