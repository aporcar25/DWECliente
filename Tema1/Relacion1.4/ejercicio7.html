<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>
<body>
    <script>
        function divisibleEntre(num1, num2) {
            if (num1 % num2 === 0) {
                return "Sí, el número " + num1 + " es divisible entre " + num2;
            } else {
                return "No, el número " + num1 + " no es divisible entre " + num2;
            }
        }

        let dividendo = prompt("Introduce el primer número (dividendo): ");
        let divisor = prompt("Introduce el segundo número (divisor): ");

        let resultado = divisibleEntre(dividendo, divisor);

        document.write("Resultado: " + resultado);
    </script>
</body>
</html>
