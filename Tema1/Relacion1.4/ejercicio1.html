<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
        function sum(...numeros) {
            let total = 0;

            for (let i = 0; i < numeros.length; i++) {
                total += numeros[i];
            }
            return total;
        }

        let num1 = Number(prompt("Introduce el primer número:"));
        let num2 = Number(prompt("Introduce el segundo número:"));
        let num3 = Number(prompt("Introduce el tercer número:"));

        let resultado = sum(num1, num2, num3);

        document.write("La suma de los números es: " + resultado);
    </script>
</body>
</html>
