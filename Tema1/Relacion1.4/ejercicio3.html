<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <script>
        function countTheArgs(...argumentos) {
            return argumentos.length;
        }

        let prueba1 = countTheArgs('cat', 'dog');
        let prueba2 = countTheArgs('cat', 'dog', 'frog', 'bear');

        document.write("Número de argumentos de la prueba 1: " + prueba1 + "<br>");
        document.write("Número de argumentos de la prueba 2: " + prueba2);
    </script>
</body>
</html>
