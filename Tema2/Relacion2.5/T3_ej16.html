<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>

    <button id="botonAbrir">Abrir ventana secundaria</button>
    <button id="botonCerrar">Cerrar ventana secundaria</button>
    <button id="botonMensaje">Envía un mensaje a la ventana secundaria</button>

    <script>
        let ventana = null;

        let botonAbrir = document.getElementById("botonAbrir");
        let botonCerrar = document.getElementById("botonCerrar");
        let botonMensaje = document.getElementById("botonMensaje");
        
        botonAbrir.onclick = () => {
            ventana = window.open("ventanaSecundaria.html", "", "width=400,height=300");
        };

        botonCerrar.onclick = () => {
            if (ventana && !ventana.closed) {
                ventana.close();
            }
        };

        botonMensaje.onclick = () => {
            if (ventana && !ventana.closed) {
                ventana.recibeMensaje("Mensaje desde la ventana principal");
            }
        };
    </script>
</body>
</html>
