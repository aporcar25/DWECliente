<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>
<body>

    <h2>Hemos cambiado de ubicación esta página. En breves momentos será redireccionado...</h2>

    <h1 id="contador">5</h1>

    <script>
         let segundos = 5;
         let elementoContador = document.getElementById("contador");
         let temporizador = setInterval(() => {
            segundos--;
            elementoContador.innerHTML = segundos;
            if (segundos === 0) {
                clearInterval(temporizador);
                window.location.href = "http://www.pccomponentes.com";
            }
         }, 1000);
    </script>
</body>
</html>
