<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <script src="funciones_strings.js"></script>
</head>
<body>

    <h2>Ejercicio 1 - Pruebas de funciones con String</h2>

    <script>
        let texto = "hola que tal javascript";

        document.write("<b>Texto original: </b>" + texto + "<br>");
        document.write("<b>a) Invertir cadena: </b>" + invierteCadena(texto) + "<br>");
        document.write("<b>b) Invertir palabras: </b>" + inviertePalabras(texto) + "<br>");
        document.write("<b>c) Longitud de la palabra más larga: </b>" + encuentraPalabraMasLarga(texto) + "<br>");
        document.write("<b>d) Palabras con más de 4 letras: </b>" + filtraPalabrasMasLargas(texto, 4) + "<br>");
        document.write("<b>e) Cadena bien formada ('hOLA qUE tAL'): </b>" + cadenaBienFormada("hOLA qUE tAL") + "<br>");
    </script>
</body>
</html>
