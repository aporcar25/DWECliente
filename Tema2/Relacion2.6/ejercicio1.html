<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 1</title>
        <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Información del Navegador Cliente</h2>

    <div id="contenedorTabla"></div>
    <script>
        const infoNavegador = {
            "Agente de usuario (userAgent)": navigator.userAgent,
            "Nombre del navegador (appName)": navigator.appName, 
            "Versión del navegador (appVersion)": navigator.appVersion,
            "Idioma (language)": navigator.language,
            "Plataforma (platform)": navigator.platform,
            "Cookies habilitadas (cookieEnabled)": navigator.cookieEnabled ? "Sí" : "No",
            "Conexión a Internet (onLine)": navigator.onLine ? "En línea" : "Sin conexión",
            "Motor del navegador (product)": navigator.product
        }

        let htmlTabla = "<table>";
        htmlTabla += "<thead><tr><th>Propiedad</th><th>Valor</th></tr></head>";
        htmlTabla += "<tbody>";

        for (let propiedad in infoNavegador) {
            htmlTabla += "<tr>";
            htmlTabla += "<td><b>" + propiedad + "</b></td>";
            htmlTabla += "<td>" + infoNavegador[propiedad] + "</td>";
            htmlTabla += "</tr>";
        }

        htmlTabla += "</tbody></table>";

        let contenedor = document.getElementById("contenedorTabla");
        contenedor.innerHTML = htmlTabla;
    </script>
</body>
</html>
