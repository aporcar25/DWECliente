<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
</head>
<body>
    <script>
        let frase = prompt("Introduce una frase:");

        if (frase) {
            let fraseMinusculas = frase.toLowerCase();
            let contadorVocales = 0;

            for (let i = 0; i < fraseMinusculas.length; i++) {
                let caracter = fraseMinusculas.charAt(i);
                if (caracter === 'a' || caracter === 'e' || caracter === 'i' || caracter === 'o' || caracter === 'u' ||
                    caracter === 'á' || caracter === 'é' || caracter === 'í' || caracter === 'ó' || caracter === 'ú') {
                    contadorVocales++;
                }
            }

            document.write("Frase introducida: \"" + frase + "\"<br>");
            document.write("Número total de vocales: " + contadorVocales);
        }
    </script>
</body>
</html>
