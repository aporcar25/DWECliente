<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>
<body>
    <script>
        let num1 = Number(prompt("Introduce el primer número: "));
        let num2 = Number(prompt("Introduce el segundo número: "));
        let num3 = Number(prompt("Introduce el tercer número: "));

        let mayor = Math.max(num1, num2, num3);

        document.write("Los números introducidos son: " + num1 + ", " + num2 + " y " + num3 + ".<br>");
        document.write("El número mayor es: " + mayor);
    </script>
</body>
</html>
