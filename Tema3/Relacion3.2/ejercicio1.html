<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>

    <h1>Ejercicio 1: Mínimo, máximo y media</h1>
    <div id="resultado"></div>
    
    <script>
        const numeros = [];

        for (let i = 0; i < 5; i++) {
            let numero = parseFloat(prompt("Introduce el número " + (i + 1) + " de 5:"));
            numeros.push(numero);
        }

        let minimo = Math.min(...numeros);
        let maximo = Math.max(...numeros);

        let suma = 0;
        for (let i = 0; i < numeros.length; i++) {
            suma += numeros[i];
        }
        let media = suma / numeros.length;

        document.getElementById("resultado").innerHTML =
            "<p>Números introducidos: " + numeros.join(", ") + "</p>" +
            "<p>Valor mínimo: " + minimo + "</p>" +
            "<p>Valor máximo: " + maximo + "</p>" +
            "<p>Valor medio: " + media + "</p>";
    </script>
</body>
</html>
