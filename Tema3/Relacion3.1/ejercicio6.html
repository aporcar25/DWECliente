<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
    <script src="utils.js"></script>
</head>
<body>

    <button onclick="calcular()">Calcular potencia</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let base = parseFloat(prompt("Introduce la base:"));
            let exponente = parseInt(prompt("Introduce el exponente:"));

            let resultado = potencia(base, exponente);

            document.getElementById("resultado").innerHTML =
                base + " elevado a " + exponente + " = <strong>" + resultado + "</strong>";
        }
    </script>
</body>

</html>
