<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
    <script src="utils.js"></script>
</head>
<body>

    <h1>Volumen de la esfera y área del círculo</h1>

    <label for="radio">Radio:</label>
    <input type="number" id="radio" step="any">
    <button onclick="calcular()">Calcular</button>

    <p id="resultado"></p>

    <script>
        function calcular() {
            let radio = parseFloat(document.getElementById("radio").value);

            let volumen = volumenEsfera(radio);
            let area = areaCirculo(radio);

            document.getElementById("resultado").innerHTML =
                "Volumen de la esfera: <strong>" + volumen.toFixed(2) + "</strong><br>" +
                "Área del círculo: <strong>" + area.toFixed(2) + "</strong>";
        }
    </script>
</body>
</html>
